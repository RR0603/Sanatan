<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Antariksha — Vedic Sky Map · Living Sanatan</title>
<meta name="description" content="Real-time Vedic planetarium: nakshatras, sidereal rashis, navagraha and Panchang. Point your phone at the sky.">
<meta name="theme-color" content="#04060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Antariksha">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="img/icon.svg">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<canvas id="sky"></canvas>
<div id="night"></div>

<div id="ui">
  <header class="topbar">
    <button class="glass icon-btn" id="btnMenu" aria-label="Settings"></button>
    <div class="search glass" id="searchBox">
      <span class="search-ico" id="searchIco"></span>
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false">
      <div class="results glass" id="searchResults" hidden></div>
    </div>
    <button class="glass chip lang" id="btnLang" aria-label="Language"><span data-l="en">EN</span><i></i><span data-l="hi">हि</span></button>
  </header>

  <section class="hud glass" id="hud">
    <button class="hud-main" id="hudMain">
      <span class="hud-loc" id="hudLoc"></span>
      <span class="hud-tithi" id="hudTithi"></span>
    </button>
    <button class="hud-clock" id="hudClock">
      <span class="badge" id="liveBadge"></span>
      <span class="hud-time" id="hudTime"></span>
      <span class="hud-date" id="hudDate"></span>
    </button>
  </section>

  <aside class="panel glass panchang" id="panchang" hidden>
    <div class="panel-head">
      <div>
        <div class="eyebrow" data-t="panchang"></div>
        <div class="panel-title" id="pTitle"></div>
      </div>
      <button class="icon-btn ghost" data-close="panchang" aria-label="Close"></button>
    </div>
    <div class="pgrid" id="pGrid"></div>
  </aside>

  <div class="side-ctrls">
    <button class="glass icon-btn" id="btnZoomIn" aria-label="Zoom in"></button>
    <button class="glass icon-btn" id="btnZoomOut" aria-label="Zoom out"></button>
    <button class="glass icon-btn compass" id="btnCompass" aria-label="Face north"><span id="compassNeedle"></span></button>
  </div>

  <div class="readout" id="readout"></div>

  <section class="timebar glass" id="timebar" hidden>
    <div class="tb-row">
      <button class="tb-btn" data-step="-86400">−1d</button>
      <button class="tb-btn" data-step="-3600">−1h</button>
      <button class="tb-btn" data-rate="rev"></button>
      <button class="tb-btn play" data-rate="toggle"></button>
      <button class="tb-btn" data-rate="fwd"></button>
      <button class="tb-btn" data-step="3600">+1h</button>
      <button class="tb-btn" data-step="86400">+1d</button>
    </div>
    <div class="tb-row">
      <input type="datetime-local" id="dtInput" step="60">
      <span class="tb-rate" id="rateLabel"></span>
      <button class="tb-now" id="btnNow" data-t="now"></button>
    </div>
  </section>

  <nav class="dock glass" id="dock"></nav>

  <section class="sheet glass" id="sheet" hidden>
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <div class="sheet-glyph" id="sGlyph"></div>
      <div class="sheet-names">
        <div class="eyebrow" id="sType"></div>
        <div class="sheet-title" id="sTitle"></div>
        <div class="sheet-sub" id="sSub"></div>
      </div>
      <button class="icon-btn ghost" data-close="sheet" aria-label="Close"></button>
    </div>
    <div class="sheet-actions">
      <button class="pill" id="btnCenter" data-t="center"></button>
      <button class="pill" id="btnTrack" data-t="track"></button>
    </div>
    <p class="sheet-desc" id="sDesc"></p>
    <div class="kv" id="sRows"></div>
  </section>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer glass" id="drawer" hidden>
    <div class="panel-head">
      <div class="brand">
        <img src="img/icon.svg" alt="" width="34" height="34">
        <div>
          <div class="brand-name" data-t="appName"></div>
          <div class="eyebrow" data-t="tagline"></div>
        </div>
      </div>
      <button class="icon-btn ghost" data-close="drawer" aria-label="Close"></button>
    </div>
    <div class="drawer-body">
      <h3 data-t="location"></h3>
      <button class="pill wide accent" id="btnGeo" data-t="useMyLocation"></button>
      <select id="citySelect" class="field"></select>
      <div class="row2">
        <label><span data-t="latitude"></span><input class="field" id="latInput" type="number" step="0.0001" min="-90" max="90"></label>
        <label><span data-t="longitude"></span><input class="field" id="lonInput" type="number" step="0.0001" min="-180" max="180"></label>
      </div>
      <button class="pill wide" id="btnApplyLoc" data-t="apply"></button>

      <h3 data-t="settings"></h3>
      <div class="toggles" id="settingToggles"></div>
      <label class="slider"><span data-t="groundOpacity"></span><input type="range" id="rngGround" min="0" max="1" step="0.05"></label>
      <label class="slider"><span data-t="starBrightness"></span><input type="range" id="rngStars" min="0.6" max="1.8" step="0.05"></label>
      <label class="slider"><span data-t="arFov"></span><input type="range" id="rngArFov" min="30" max="100" step="1"></label>
      <label class="slider"><span data-t="compassOffset"> </span><input type="range" id="rngCompass" min="-45" max="45" step="0.5"></label>
      <button class="pill wide" id="btnResetView" data-t="resetView"></button>

      <h3 data-t="about"></h3>
      <p class="about" data-t="aboutText"></p>
      <a class="pill wide accent link" href="https://livingsanatan.com" target="_blank" rel="noopener" data-t="visit"></a>
      <p class="credits" data-t="credits"></p>
    </div>
  </aside>

  <div class="toast glass" id="toast" hidden></div>
</div>
<button class="glass icon-btn show-ui" id="btnShowUi" aria-label="Show interface" hidden></button>

<script src="js/vendor/astronomy.browser.min.js"></script>
<script src="js/data/stars.js"></script>
<script src="js/data/constellations.js"></script>
<script src="js/vedic.js"></script>
<script src="js/i18n.js"></script>
<script src="js/sky.js"></script>
<script src="js/render.js"></script>
<script src="js/sensors.js"></script>
<script src="js/app.js"></script>
</body>
</html>
