name: Membership API

on:
  push:
    paths: ['worker/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check the Worker bundles
        run: npx wrangler deploy --dry-run --outdir dist

  # Deploys when main changes, once the CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID repository secrets exist (Settings -> Secrets ->
  # Actions). Without them this job is skipped. Member content is never
  # deployed from here: it stays private and is uploaded by hand.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Refuse to deploy placeholder config
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if grep -q 'REPLACE_' wrangler.toml; then
            echo "::error::wrangler.toml still has REPLACE_ placeholders (KV ids or product ids). See SUBSCRIPTIONS.md step 3."
            exit 1
          fi
      - run: npx wrangler deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping deploy."
