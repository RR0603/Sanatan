# Builds a signed Android App Bundle (.aab) and, if configured, uploads it to Google Play.
# Run it from GitHub → Actions → "Android release" → Run workflow, or push a tag like v1.0.0.
# Secrets (Settings → Secrets and variables → Actions) — see LAUNCH.md, step A4:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON (optional: enables automatic upload to the chosen track)
# Secrets are passed only to the steps that need them; third-party actions are pinned to commits.
name: Android release
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      # No install scripts in release builds (none are needed to build the app).
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run preflight
      - run: npm run build && npx cap sync android
      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease -PversionCode=$(( GITHUB_RUN_NUMBER + 100 ))
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: antariksha-android-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Is automatic upload configured?
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "enabled=$([ -n "$PLAY_JSON" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Upload to Google Play
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.livingsanatan.antariksha
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          # 'draft' is required until the app's first release has been reviewed; switch to 'completed' after launch.
          status: draft
