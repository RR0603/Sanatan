# Builds a signed Android App Bundle (.aab) and, if configured, uploads it to Google Play.
# Run it from GitHub → Actions → "Android release" → Run workflow, or push a tag like v1.0.0.
# Secrets (Settings → Secrets and variables → Actions) — see LAUNCH.md, step A4:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON (optional: enables automatic upload to the internal testing track)
name: Android release
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track (internal, alpha = closed testing, beta = open testing, production)'
        default: internal
  push:
    tags: ['v*']
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run build && npx cap sync android
      - name: Decode upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease -PversionCode=$(( GITHUB_RUN_NUMBER + 100 ))
      - uses: actions/upload-artifact@v4
        with:
          name: antariksha-android-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload to Google Play
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.livingsanatan.antariksha
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          # 'draft' is required until the app's first release has been reviewed; switch to 'completed' after launch.
          status: draft
