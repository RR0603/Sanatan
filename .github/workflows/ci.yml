# Runs the test suite (Panchang / chart accuracy, sensor fusion, magnetic model, script syntax).
name: CI
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run preflight -- --warn
      - run: npm run build
