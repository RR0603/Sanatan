name: Daily briefing

on:
  schedule:
    # 01:30 UTC = 07:00 IST. GitHub runs scheduled jobs on UTC only, so change
    # this line (not a timezone setting) if you want a different delivery time.
    # Free runners are busiest on the hour, so :30 tends to start sooner.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the briefing in the log instead of sending it"
        type: boolean
        default: false

concurrency:
  group: daily-briefing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          BRIEFING_TZ: ${{ vars.BRIEFING_TZ }}
          BRIEFING_PLACE: ${{ vars.BRIEFING_PLACE }}
          BRIEFING_LAT: ${{ vars.BRIEFING_LAT }}
          BRIEFING_LON: ${{ vars.BRIEFING_LON }}
          BRIEFING_NAME: ${{ vars.BRIEFING_NAME }}
          BRIEFING_UNITS: ${{ vars.BRIEFING_UNITS }}
          BRIEFING_SECTIONS: ${{ vars.BRIEFING_SECTIONS }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
          NEWS_LIMIT: ${{ vars.NEWS_LIMIT }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m briefing --dry-run
          else
            python -m briefing
          fi
